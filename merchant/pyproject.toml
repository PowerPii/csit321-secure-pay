[project]
name = "fyp-merchant"
version = "0.1.0"
description = "Test-harness storefront in plain Django templates: products, orders, and a receiver for HMAC-signed gateway events."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "argon2-cffi>=23.1",
    "gunicorn>=23.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "hypothesis>=6",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.1",
    "pip-audit>=2.7",  # CI dependency audit (.github/ci-python.sh)
    "bandit>=1.7",  # CI code audit
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]  # generated by Django

[tool.ruff.lint.per-file-ignores]
# Django reads Meta options and ModelAdmin attributes as plain lists; ClassVar adds nothing.
"**/models.py" = ["RUF012"]
"**/admin.py" = ["RUF012"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "config*"]
