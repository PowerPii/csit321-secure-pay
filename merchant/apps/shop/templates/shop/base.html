{% load shop %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Demo Shop{% endblock %}</title>
  {% block head %}{% endblock %}
  <style>
    /* Plain styles after the low-fi wireframes C1, C2 and C8. */
    :root { --ink:#1f1f1f; --ink-2:#333; --muted:#6b6b6b; --line:#d4d4d4; --panel:#f2f2f2; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size:15px; line-height:1.4; color:var(--ink); }
    * { box-sizing:border-box; } body { margin:0; }
    header { display:flex; justify-content:space-between; align-items:center; padding:16px 64px; border-bottom:1px solid var(--line); }
    header a { color:var(--ink); text-decoration:none; } .logo { font-weight:700; font-size:18px; }
    .layout { display:grid; grid-template-columns: 1fr 400px; min-height:calc(100vh - 56px); }
    .main { padding:40px 48px; } .side { background:var(--panel); padding:32px; }
    h1 { font-size:22px; margin:8px 0 16px; } h2 { font-size:17px; margin:0 0 12px; }
    .muted { color:var(--muted); } .small { font-size:13px; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:20px; }
    .product { border:1px solid var(--line); border-radius:6px; padding:10px; display:flex; flex-direction:column; gap:6px; }
    .product svg { width:100%; height:150px; background:#e6e6e6; border:1px solid #bbb; }
    .price { font-weight:600; }
    .btn { display:block; width:100%; font:inherit; font-weight:600; text-align:center; text-decoration:none; padding:11px 16px; border-radius:6px; cursor:pointer; border:1.5px solid var(--ink-2); background:#fff; color:var(--ink); }
    .btn.primary { background:var(--ink-2); color:#fff; } .btn.inline { display:inline-block; width:auto; }
    .card { background:#ebebeb; border-radius:8px; padding:14px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:4px 0; } .row .muted { flex:1; }
    .total { border-top:1px solid #c8c8c8; margin-top:8px; padding-top:10px; }
    .linkbtn { background:none; border:0; color:var(--muted); cursor:pointer; font:inherit; font-size:12px; padding:0 0 0 8px; text-decoration:underline; }
    form.inline { display:inline; }
    .fields { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; max-width:830px; }
    .fields .wide { grid-column:1 / -1; }
    label { display:block; font-size:13px; font-weight:600; margin-bottom:6px; }
    input[type=text], input[type=email] { width:100%; font:inherit; padding:10px 12px; border:1px solid #9a9a9a; border-radius:6px; }
    .errorlist { color:#b42318; font-size:12px; margin:4px 0 0; padding:0; list-style:none; }
    .pay { display:flex; gap:16px; align-items:center; margin-top:18px; max-width:830px; } .pay .btn { width:auto; }
    .narrow { max-width:610px; margin:0 auto; padding:40px 16px; }
    .badge { display:inline-block; font-size:12px; font-weight:600; padding:2px 10px; border-radius:999px; border:1px solid #8a8a8a; background:#e6e6e6; }
    .badge.dark { background:var(--ink-2); color:#fff; border-color:var(--ink-2); }
    .box { border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin:14px 0; }
    .box.white { background:#fff; }
    .note { background:#eee; border-radius:8px; padding:12px 14px; margin:14px 0; }
    .alert { background:#fdf0ef; border:1px solid #f3c7c3; color:#b42318; border-radius:6px; padding:10px 12px; margin-bottom:14px; }
    @media (max-width: 860px) {
      header { padding:14px 16px; } .layout { grid-template-columns:1fr; } .main { padding:20px 16px; } .side { padding:16px; }
      .grid { grid-template-columns:1fr 1fr; gap:12px; } .fields { grid-template-columns:1fr; } .pay { flex-direction:column; align-items:stretch; } .pay .btn { width:100%; }
    }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="{% url 'shop-home' %}">Demo Shop</a>
    <nav>{% block nav %}<a href="{% url 'shop-home' %}#cart">Cart ({{ cart_count|default:0 }})</a>{% endblock %}</nav>
  </header>
  {% block body %}{% endblock %}
</body>
</html>
