name: ci

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, simulator, merchant]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      DB_PASSWORD: postgres
      VAULT_DB_USER: postgres
      VAULT_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit bandit
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      # JUnit results feed the non-functional test report (job test-report below).
      - run: pytest --junitxml=junit-${{ matrix.service }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.service }}
          path: ${{ matrix.service }}/junit-${{ matrix.service }}.xml
          if-no-files-found: ignore
      - run: pip-audit
      - run: bandit -q -r apps -x "*/tests.py,*/test_*.py"

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [checkout, dashboard, website]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      - if: matrix.app == 'website'
        run: npm test
      - if: matrix.app != 'website'
        run: npm test -- --passWithNoTests --reporter=default --reporter=junit --outputFile.junit=junit-${{ matrix.app }}.xml
      - uses: actions/upload-artifact@v4
        if: always() && matrix.app != 'website'
        with:
          name: junit-${{ matrix.app }}
          path: frontend/${{ matrix.app }}/junit-${{ matrix.app }}.xml
          if-no-files-found: ignore
      - if: matrix.app == 'website'
        run: npm run build
      # Audit what ships to the browser. Build tools (vite and its file matchers) never reach
      # the site; an advisory there with no fixed version blocked every merge and deploy
      # (picomatch GHSA-fc5q-39xc-vjpf, 17 Nov 2026). Decided by Fifa, 17 Nov 2026.
      - run: npm audit --audit-level=high --omit=dev

  # The non-functional test report (URS Section 4.4): maps every requirement to the tests
  # above and to the manual checks (docs/test-report/). Red if any requirement fails or the
  # mapping names a test that no longer exists. The report is on the run's summary page and
  # in the test-report artifact.
  test-report:
    if: always()
    needs: [python, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python tests/report/build_report.py --check
      - uses: actions/download-artifact@v4
        with:
          pattern: junit-*
          path: reports
          merge-multiple: true
      - run: python tests/report/build_report.py --junit reports --out TEST-REPORT.md --strict
      - if: always()
        run: test -f TEST-REPORT.md && cat TEST-REPORT.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: TEST-REPORT.md
          if-no-files-found: ignore

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml openapi-spec-validator
      - run: python contracts/check.py

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The public server's Compose file and Caddyfile parse with the example settings, and the
  # production Caddy image (checkout + dashboard bundles) builds.
  deploy-config:
    runs-on: ubuntu-latest
    env:
      MAIL_PASSWORD_HASH: $2a$14$abcdefghijklmnopqrstuuMOs2yZ1nOv8wOEUx1AYQ1zt6S1zBe2m
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file deploy/prod.env.example -f deploy/compose.prod.yaml config -q
      - run: >
          docker run --rm -e DOMAIN=203-0-113-5.sslip.io -e ACME_EMAIL=ci@example.com
          -e MAIL_USER=team -e MAIL_PASSWORD_HASH
          -v "$PWD/deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -f deploy/caddy/Dockerfile -t securepay-caddy .
      # bash -n checks only its first file, so check each script on its own.
      - run: for f in deploy/make-secrets.sh deploy/server-setup.sh deploy/smoke-check.sh deploy/backup/backup.sh deploy/auto-deploy.sh deploy/setup-auto-deploy.sh deploy/demo.sh deploy/move-server.sh deploy/public-ip.sh deploy/watchdog.sh deploy/freeze.sh deploy/backup/verify.sh; do bash -n "$f" || exit 1; done

  # Demo merge freeze (deploy/RUNBOOK.md section 10a): while the repository variable
  # MERGE_FREEZE_UNTIL (e.g. 2027-04-02T18:00+08:00) is in the future, pull requests show
  # this check red, so nobody merges by accident. The deploy workflow also refuses to run.
  merge-freeze:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - env:
          UNTIL: ${{ vars.MERGE_FREEZE_UNTIL }}
        run: |
          if [ -z "$UNTIL" ]; then echo "No merge freeze."; exit 0; fi
          end="$(date -d "$UNTIL" +%s)" || { echo "::error::MERGE_FREEZE_UNTIL is not a date: $UNTIL"; exit 1; }
          if [ "$end" -gt "$(date +%s)" ]; then
            echo "::error::Merge freeze for a demo until $UNTIL. Do not merge; wait, or ask Fifa to clear MERGE_FREEZE_UNTIL."
            exit 1
          fi
          echo "The freeze ended at $UNTIL."
