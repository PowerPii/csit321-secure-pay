name: ci

on: [push, pull_request]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, simulator, merchant]
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    env:
      DJANGO_DEBUG: "1"
      POSTGRES_HOST: localhost
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      DB_PASSWORD: postgres
      VAULT_DB_USER: postgres
      VAULT_DB_PASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pip-audit bandit
      - run: ruff check .
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: pytest
      - run: pip-audit
      - run: bandit -q -r apps -x "*/tests.py,*/test_*.py"

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [checkout, dashboard, website]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npx tsc --noEmit
      - run: npm test -- --passWithNoTests
      - if: matrix.app == 'website'
        run: npm run build
      - run: npm audit --audit-level=high

  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema pyyaml openapi-spec-validator
      - run: python contracts/check.py

  secrets-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The public server's Compose file and Caddyfile parse with the example settings, and the
  # production Caddy image (checkout + dashboard bundles) builds.
  deploy-config:
    runs-on: ubuntu-latest
    env:
      MAIL_PASSWORD_HASH: $2a$14$abcdefghijklmnopqrstuuMOs2yZ1nOv8wOEUx1AYQ1zt6S1zBe2m
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file deploy/prod.env.example -f deploy/compose.prod.yaml config -q
      - run: >
          docker run --rm -e DOMAIN=203-0-113-5.sslip.io -e ACME_EMAIL=ci@example.com
          -e MAIL_USER=team -e MAIL_PASSWORD_HASH
          -v "$PWD/deploy/Caddyfile.prod:/etc/caddy/Caddyfile:ro"
          caddy:2 caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: docker build -f deploy/caddy/Dockerfile -t securepay-caddy .
      # bash -n checks only its first file, so check each script on its own.
      - run: for f in deploy/make-secrets.sh deploy/server-setup.sh deploy/smoke-check.sh deploy/backup/backup.sh deploy/auto-deploy.sh deploy/setup-auto-deploy.sh deploy/demo.sh deploy/move-server.sh deploy/public-ip.sh; do bash -n "$f" || exit 1; done
