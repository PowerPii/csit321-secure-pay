# How each non-functional requirement in URS Section 4.4 is verified.
#
#   ci:     tests that run in GitHub Actions on every push (service: file::test name).
#           Acceptance tests in gateway/acceptance/ check the URS criterion at its own numbers;
#           the others are older unit tests that cover part of it.
#   stack:  tests/integration, run by hand against the Compose stack (tests/integration/README.md).
#   manual: checks that need the live server, a browser or people. Procedures are in
#           MANUAL-TESTS.md under the same ID; results go in manual-results.yaml.
#
# A requirement passes when every ci test passed and every manual check has a passing result.
# `python tests/report/build_report.py --check` fails if a test named here no longer exists.

